[package]
name = "tauri-plugin-permission-guide"
version = "0.1.0"
edition = "2021"
description = "Tauri v2 plugin: docked macOS permission guide panel (Accessibility, Screen Recording, Input Monitoring)"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/winstonzhao/permission-guide"
homepage = "https://github.com/winstonzhao/permission-guide"
readme = "README.md"
keywords = ["tauri", "tauri-plugin", "macos", "permissions", "accessibility"]
categories = ["os::macos-apis", "gui"]
links = "tauri-plugin-permission-guide"
include = ["src/**", "/build.rs", "permissions/**", "guest-js/**", "/Cargo.toml", "/README.md", "/LICENSE"]

[package.metadata.docs.rs]
targets = ["aarch64-apple-darwin"]

[lib]
name = "tauri_plugin_permission_guide"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
permission-guide = { path = "../rust", version = "0.1.0" }

# Standalone: the example app lives in a subdirectory and is its own workspace.
[workspace]
members = []
