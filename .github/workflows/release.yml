name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  xcframework:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/build-xcframework.sh
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            dist/PermissionGuide.xcframework.zip dist/PermissionGuide.xcframework.zip.sha256
